<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
        <style>
            :root {
                --bg: #0f172a;
                --card-bg: #1e293b;
                --text: #f8fafc;
                --placeholder: #94a3b8;
                --border: #334155;
                --input-bg: #0f172a;
                --focus-ring: #60a5fa;
                --btn-bg: #3b82f6;
                --btn-hover: #2563eb;
                --btn-text: #ffffff;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: var(--bg);
                color: var(--text);
                display: flex;
                min-height: 100vh;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
            }

            form {
                background: var(--card-bg);
                padding: 2rem;
                border-radius: 12px;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
                border: 1px solid var(--border);
                width: 100%;
                max-width: 400px;
                display: flex;
                flex-direction: column;
                gap: 1.25rem;
            }

            /* Form Header Styles */
            .form-header {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
                margin-bottom: 0.25rem;
            }

            .form-title {
                font-size: 1.35rem;
                font-weight: 700;
                color: var(--text);
                letter-spacing: -0.02em;
            }

            /* Container for horizontal layout */
            .field-row {
                display: flex;
                gap: 1rem;
            }

            .field-group {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                flex: 1;
            }

            label {
                font-size: 0.85rem;
                color: var(--placeholder);
                font-weight: 500;
            }

            /* Shared base input styles */
            input[type="text"],
            input[type="number"],
            input[type="color"] {
                width: 100%;
                font-size: 0.95rem;
                background-color: var(--input-bg);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 8px;
                outline: none;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            input[type="text"],
            input[type="number"] {
                padding: 0.75rem 1rem;
            }

            input[type="text"]::placeholder,
            input[type="number"]::placeholder {
                color: var(--placeholder);
            }

            input[type="text"]:focus,
            input[type="number"]:focus,
            input[type="color"]:focus {
                border-color: var(--focus-ring);
                box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
            }

            /* Custom Color Picker Adjustments */
            input[type="color"] {
                height: 46px;
                padding: 4px;
                cursor: pointer;
            }

            input[type="color"]::-webkit-color-swatch-wrapper {
                padding: 0;
            }

            input[type="color"]::-webkit-color-swatch {
                border: none;
                border-radius: 6px;
            }

            input[type="color"]::-moz-color-swatch {
                border: none;
                border-radius: 6px;
            }

            input[type="submit"] {
                background-color: var(--btn-bg);
                color: var(--btn-text);
                font-weight: 600;
                font-size: 0.95rem;
                padding: 0.75rem 1rem;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: background-color 0.2s ease, transform 0.1s ease;
            }

            input[type="submit"]:hover {
                background-color: var(--btn-hover);
            }

            input[type="submit"]:active {
                transform: scale(0.98);
            }
        </style>
    </head>
    <body>
        <form hx-post="/" hx-swap="none" hx-on::after-request="if (event.detail.successful) { this.elements['msg'].value = ''; this.elements['msg'].focus(); }">
            <!-- Form Header Section -->
            <div class="form-header">
                <h2 class="form-title">Send Me a Message</h2>
            </div>

            <input type="text" name="msg" placeholder="Say something" required>
            <input type="text" name="name" placeholder="Sign here" required>
            
            <div class="field-row">
                <div class="field-group">
                    <label for="font_size">Font Size (px)</label>
                    <input type="number" id="font_size" name="font_size" min="15" max="100" value="20" required>
                </div>

                <div class="field-group">
                    <label for="color">Color</label>
                    <input type="color" id="color" name="color" value="#00ffcc" title="Choose a color">
                </div>
            </div>

            <input type="submit" value="Send!">
        </form>
    </body>
</html>
