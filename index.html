<!doctype html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
		<style>
            :root {
                --bg: #0f172a;
                --card-bg: #1e293b;
                --text: #f8fafc;
                --placeholder: #94a3b8;
                --border: #334155;
                --input-bg: #0f172a;
                --focus-ring: #60a5fa;
                --btn-bg: #3b82f6;
                --btn-hover: #2563eb;
                --btn-text: #ffffff;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: var(--bg);
                color: var(--text);
                display: flex;
                min-height: 100vh;
                align-items: center;
                justify-content: center;
                padding: 1.5rem;
            }

            form {
                background: var(--card-bg);
                padding: 2rem;
                border-radius: 12px;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
                border: 1px solid var(--border);
                width: 100%;
                max-width: 400px;
                display: flex;
                flex-direction: column;
                gap: 1.25rem;
            }

            input[type="text"] {
                width: 100%;
                padding: 0.75rem 1rem;
                font-size: 0.95rem;
                background-color: var(--input-bg);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 8px;
                outline: none;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            input[type="text"]::placeholder {
                color: var(--placeholder);
            }

            input[type="text"]:focus {
                border-color: var(--focus-ring);
                box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
            }

            input[type="submit"] {
                background-color: var(--btn-bg);
                color: var(--btn-text);
                font-weight: 600;
                font-size: 0.95rem;
                padding: 0.75rem 1rem;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: background-color 0.2s ease, transform 0.1s ease;
            }

            input[type="submit"]:hover {
                background-color: var(--btn-hover);
            }

            input[type="submit"]:active {
                transform: scale(0.98);
            }
        </style>
    </head>
    <body>
        <form hx-post="/" hx-swap="none" hx-on::after-request="if (event.detail.successful) { this.elements['msg'].value = ''; this.elements['msg'].focus(); }">
            <input type="text" name="msg" placeholder="Say something" required>
            <input type="text" name="name" placeholder="Sign here" required>
            <input type="submit" value="Send!">
        </form>
    </body>
</html>
